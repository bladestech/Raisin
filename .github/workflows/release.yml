# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build
# raisin.exe and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item target/release/raisin.exe raisin.exe
          $hash = (Get-FileHash raisin.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  raisin.exe" | Out-File raisin.exe.sha256 -Encoding ascii
          gh release create "${{ github.ref_name }}" raisin.exe raisin.exe.sha256 `
            --title "Raisin ${{ github.ref_name }}" --generate-notes
