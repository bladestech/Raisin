[package]
name = "raisin"
version = "0.1.5"
edition = "2021"
description = "Lightweight Razer mouse configurator for Windows (DPI, polling rate, battery)"
license = "MIT"
repository = "https://github.com/bladestech/Raisin"
readme = "README.md"
keywords = ["razer", "mouse", "dpi", "synapse", "windows"]
categories = ["hardware-support"]
# A Windows app, not a library.
publish = false

[build-dependencies]
embed-resource = "3.0"

# COM bindings for the settings window's Direct2D/DirectWrite rendering.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
]

[dependencies.windows-numerics]
version = "0.3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Power",
    "Win32_System_SystemServices",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
